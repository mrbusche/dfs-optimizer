[project]
name = "dfs-optimizer"
version = "0.1.0"
description = "DraftKings lineup optimizer using linear programming"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "highspy==1.15.1",
  "pandas==3.0.6",
  "python-dotenv==1.2.3",
  "pulp==4.0.0a12",
  "pydantic==2.14.0b2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.8", "ty==0.0.83"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
ignore = []
